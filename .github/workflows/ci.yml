name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "**/docs/**"
      - "**/doc/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "**/docs/**"
      - "**/doc/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  starry_orangepi_npu_yolov8:
    name: Test starry self-hosted board orangepi-5-plus npu-yolov8
    uses: ./.github/workflows/reusable-command.yml
    with:
      runs_on: '["self-hosted","linux","board"]'
      use_container: false
      command: cargo xtask starry test board --board orangepi-5-plus --test-case npu-yolov8
      cache_key: ""
      container_image: ""
      limit_to_owner: rcore-os
      main_pr_only: false
      fetch_depth: "1"
      timeout_minutes: 360
