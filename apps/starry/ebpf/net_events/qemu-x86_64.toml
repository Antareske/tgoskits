args = [
    "-nographic",
    "-m",
    "512M",
    "-smp",
    "4",
    "-device",
    "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/target/axbuild/rootfs/rootfs-x86_64-alpine.img",
    "-device",
    "virtio-net-pci,netdev=net0",
    "-netdev",
    "user,id=net0",
]
uefi = true
to_bin = true
fail_regex = ['(?i)\bpanic(?:ked)?\b', "(?m)^NET_EVENTS_FAILED"]
timeout = 300

[host_http_server]
bind = "127.0.0.1"
port = 18392
body = "net-events\n"

[[shell_check_steps]]
shell_prefix = "root@starry:"
shell_cmd = "/usr/bin/net-events-check"
success_regex = ["(?m)^NET_EVENTS_PASSED\\s*$"]
