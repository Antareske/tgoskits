[package]
name = "act-infer-rk3588"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "act-infer-golden-rknn"
path = "src/bin/golden_rknn.rs"

[[bin]]
name = "act-infer-review-rknn"
path = "src/bin/review_rknn.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
